name: Release validation
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Acceptance scope
        type: choice
        default: all
        options: [all, scrolling, commerce]
      runtime:
        description: iOS runtime scope
        type: choice
        default: all
        options: [all, '18', '26']
      toolchain:
        description: Xcode pairing for older-runtime diagnostics
        type: choice
        default: current
        options: [current, paired]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone-16-Pro, iPad-Pro-13-inch-M4-8GB]
        os: ${{ fromJSON(inputs.runtime == '18' && '["18"]' || inputs.runtime == '26' && '["26"]' || '["18","26"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.toolchain == 'paired' && matrix.os == '18' && '16.4' || '26.3' }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
      - name: Core tests
        run: swift test
      - name: Create simulator
        env:
          OS_MAJOR: ${{ matrix.os }}
          DEVICE_TYPE: ${{ matrix.device }}
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys,os; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["name"].startswith("iOS " + os.environ["OS_MAJOR"] + ".")))')
          DEVICE=$(xcrun simctl create 'SubSense Release Validation' "com.apple.CoreSimulator.SimDeviceType.$DEVICE_TYPE" "$RUNTIME")
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Native UI tests
        env:
          TEST_SUITE: ${{ inputs.suite }}
        run: |
          set -o pipefail
          TEST_SELECTION=()
          if [ "$TEST_SUITE" = commerce ]; then
            TEST_SELECTION=(-only-testing:SubSenseUITests/SubSenseUITests/testPurchaseRestoreAndExpiration)
          fi
          if [ "$TEST_SUITE" = scrolling ]; then
            TEST_SELECTION=(
              -only-testing:SubSenseUITests/SubSenseUITests/testDarkModeLargeTextAndLandscape
              -only-testing:SubSenseUITests/SubSenseUITests/testPurchaseRestoreAndExpiration
              -only-testing:SubSenseUITests/SubSenseUITests/testReceiptReviewAndExport
            )
          fi
          xcodebuild -project SubSense.xcodeproj -scheme SubSense \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 300 \
            -resultBundlePath ReleaseTests \
            "${TEST_SELECTION[@]}" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test 2>&1 | tee tests.log
      - name: Collect screenshots and crash diagnostics
        if: always()
        run: |
          mkdir -p diagnostics/screenshots diagnostics/crashes
          xcrun xcresulttool export attachments --path ReleaseTests.xcresult --output-path diagnostics/screenshots || true
          find "$HOME/Library/Logs/DiagnosticReports" -name '*SubSense*' -type f -exec cp {} diagnostics/crashes/ \; || true
          if [ -n "$SIMULATOR_ID" ]; then
            xcrun simctl spawn "$SIMULATOR_ID" log show --last 20m --style compact --predicate 'process == "SubSense"' > diagnostics/app.log 2>&1 || true
            xcrun simctl spawn "$SIMULATOR_ID" log show --last 20m --style compact --predicate 'process == "storekitd" OR process == "appstored" OR subsystem CONTAINS[c] "storekit"' > diagnostics/storekit.log 2>&1 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-${{ matrix.device }}-ios${{ matrix.os }}
          path: |
            tests.log
            diagnostics
            ReleaseTests.xcresult
          retention-days: 7
