name: Apple build and tests
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core calculations and model tests
        run: swift test
      - name: Build native app for iOS Simulator
        run: xcodebuild -project SubSense.xcodeproj -scheme SubSense -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Pick available iPhone simulator
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          echo "SIMULATOR_ID=$ID" >> "$GITHUB_ENV"
      - name: UI navigation and screenshot tests
        run: xcodebuild -project SubSense.xcodeproj -scheme SubSense -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath TestResults CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-test-results
          path: TestResults.xcresult
